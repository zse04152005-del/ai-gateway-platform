openapi: 3.1.0
info:
  title: AI Gateway API
  version: 0.1.0
  description: >-
    MVP public data-plane API. It intentionally supports a documented subset of
    OpenAI-compatible chat completions. Unsupported fields that change semantics
    or billing are rejected instead of silently ignored.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Models
  - name: Chat
  - name: Requests
  - name: Virtual Keys
paths:
  /health/live:
    get:
      operationId: live
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Process can serve requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /v1/models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List logical models available to the authenticated virtual key
      description: >-
        Returns the intersection of the active project allowlist, the virtual
        key narrowing policy, and logical models backed by at least one active
        provider deployment. Physical deployment details are never returned.
      responses:
        '200':
          description: Available logical models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
  /v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: Create a normal or SSE streaming chat completion
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: >-
            JSON response when stream=false, or text/event-stream when stream=true.
            A gateway heartbeat is an SSE comment/event and is never model content.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: OpenAI-compatible data events terminated by data [DONE].
              examples:
                simple:
                  value: |-
                    data: {"id":"chatcmpl_1","object":"chat.completion.chunk","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}

                    data: [DONE]
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '499':
          $ref: '#/components/responses/ClientClosedRequest'
        '501':
          $ref: '#/components/responses/NotImplemented'
        '502':
          $ref: '#/components/responses/ProviderFailure'
        '503':
          $ref: '#/components/responses/GatewayUnavailable'
        '504':
          $ref: '#/components/responses/ProviderTimeout'
  /admin/v1/requests/{requestId}/attempts:
    get:
      tags: [Requests]
      operationId: getRequestAttempts
      summary: List route attempts for an authorized request
      description: Administrative endpoint; production deployment uses separate admin authentication.
      security:
        - adminOidc: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request attempts
          content:
            application/json:
              schema:
                type: object
                required: [request_id, attempts]
                properties:
                  request_id:
                    type: string
                  attempts:
                    type: array
                    items:
                      $ref: '#/components/schemas/RouteAttempt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/tenants/{tenantId}/projects/{projectId}/virtual-keys:
    post:
      tags: [Virtual Keys]
      operationId: createVirtualKey
      summary: Create a virtual data-plane credential
      description: The full credential is returned by this operation exactly once.
      security:
        - adminOidc: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualKeyRequest'
      responses:
        '201':
          description: Credential created; the credential field cannot be retrieved later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
  /admin/v1/tenants/{tenantId}/projects/{projectId}/virtual-keys/{virtualKeyId}:
    get:
      tags: [Virtual Keys]
      operationId: getVirtualKey
      summary: Get safe virtual key metadata
      description: This response never contains the credential secret or its digest.
      security:
        - adminOidc: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VirtualKeyIdPath'
      responses:
        '200':
          description: Safe credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualKeyMetadata'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/v1/tenants/{tenantId}/projects/{projectId}/virtual-keys/{virtualKeyId}/rotate:
    post:
      tags: [Virtual Keys]
      operationId: rotateVirtualKey
      summary: Atomically replace a virtual key
      description: The replacement credential is returned once; the source remains usable only during the requested grace period.
      security:
        - adminOidc: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VirtualKeyIdPath'
        - $ref: '#/components/parameters/AdminActor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateVirtualKeyRequest'
      responses:
        '201':
          description: Replacement credential created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedVirtualKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/v1/tenants/{tenantId}/projects/{projectId}/virtual-keys/{virtualKeyId}/revoke:
    post:
      tags: [Virtual Keys]
      operationId: revokeVirtualKey
      summary: Permanently revoke a virtual key
      description: Repeating the same request preserves and returns the original revocation fact.
      security:
        - adminOidc: []
      parameters:
        - $ref: '#/components/parameters/TenantIdPath'
        - $ref: '#/components/parameters/ProjectIdPath'
        - $ref: '#/components/parameters/VirtualKeyIdPath'
        - $ref: '#/components/parameters/AdminActor'
      responses:
        '200':
          description: Revoked credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualKeyMetadata'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    virtualKey:
      type: http
      scheme: bearer
      bearerFormat: agw_live_<safe-prefix>.<base64url-secret>
      description: Full credential returned once by the control plane; tenant/project headers never establish identity.
    adminOidc:
      type: http
      scheme: bearer
      bearerFormat: OIDC JWT
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client correlation ID. The gateway may replace invalid or conflicting values.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required only for operations or policies that enable replay protection.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$'
    TenantIdPath:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VirtualKeyIdPath:
      name: virtualKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminActor:
      name: X-Admin-Actor
      in: header
      required: true
      description: Audited actor resolved by the trusted admin authentication layer.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    RequestId:
      description: Gateway request identifier
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        config_version:
          type: integer
          format: int64
    ChatCompletionRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
          description: Logical model name, not a provider deployment name.
        messages:
          type: array
          minItems: 1
          maxItems: 1024
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
          description: >-
            Deprecated compatibility alias for max_completion_tokens. Supplying
            both fields is rejected.
        max_completion_tokens:
          type: integer
          minimum: 1
        stop:
          oneOf:
            - type: string
              maxLength: 256
            - type: array
              maxItems: 16
              items:
                type: string
                maxLength: 256
        tools:
          type: array
          maxItems: 128
          items:
            $ref: '#/components/schemas/ToolDefinition'
        tool_choice:
          oneOf:
            - type: string
              enum: [none, auto, required]
            - type: object
              additionalProperties: false
              required: [type, function]
              properties:
                type:
                  const: function
                function:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
        response_format:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type:
                  enum: [text, json_object]
            - type: object
              additionalProperties: false
              required: [type, json_schema]
              properties:
                type:
                  const: json_schema
                json_schema:
                  type: object
                  additionalProperties: false
                  required: [name, schema]
                  properties:
                    name:
                      type: string
                      pattern: '^[A-Za-z_][A-Za-z0-9_.:-]{0,127}$'
                    description:
                      type: string
                      maxLength: 4096
                    schema:
                      type: object
                    strict:
                      type: boolean
        user:
          type: string
          maxLength: 256
          description: Application-scoped end-user reference; never trusted as a tenant identifier.
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role]
      description: >-
        content is required except for assistant messages carrying tool_calls;
        tool_call_id is required only for tool messages.
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ContentPart'
            - type: 'null'
        name:
          type: string
          maxLength: 128
        tool_call_id:
          type: string
          maxLength: 256
        tool_calls:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/AssistantToolCall'
    ContentPart:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image_url]
        text:
          type: string
        image_url:
          type: object
          additionalProperties: false
          required: [url]
          properties:
            url:
              type: string
              maxLength: 16384
            detail:
              type: string
              enum: [auto, low, high]
    AssistantToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id:
          type: string
          maxLength: 256
        type:
          const: function
        function:
          type: object
          additionalProperties: false
          required: [name, arguments]
          properties:
            name:
              type: string
              pattern: '^[A-Za-z_][A-Za-z0-9_.:-]{0,127}$'
            arguments:
              type: string
              description: A string containing exactly one JSON object.
    ToolDefinition:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type:
          const: function
        function:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name:
              type: string
              pattern: '^[A-Za-z_][A-Za-z0-9_.:-]{0,127}$'
            description:
              type: string
              maxLength: 4096
            parameters:
              type: object
              description: JSON Schema for function arguments.
    ChatCompletionResponse:
      type: object
      additionalProperties: false
      required: [id, object, created, model, choices, gateway]
      properties:
        id:
          type: string
        object:
          const: chat.completion
        created:
          type: integer
          format: int64
        model:
          type: string
          description: Logical model name.
        provider_model:
          type: string
          description: May be omitted by tenant policy.
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                $ref: '#/components/schemas/AssistantMessage'
              finish_reason:
                type: string
                enum: [stop, length, tool_calls, content_filter, cancelled, error, unknown]
        usage:
          $ref: '#/components/schemas/Usage'
        gateway:
          $ref: '#/components/schemas/GatewayMetadata'
    AssistantMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          const: assistant
        content:
          type: [string, 'null']
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/AssistantToolCall'
    Usage:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, total_tokens, source]
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        prompt_tokens_details:
          type: object
          additionalProperties: false
          properties:
            cached_tokens:
              type: integer
              minimum: 0
            cache_write_tokens:
              type: integer
              minimum: 0
            audio_tokens:
              type: integer
              minimum: 0
        completion_tokens_details:
          type: object
          additionalProperties: false
          properties:
            reasoning_tokens:
              type: integer
              minimum: 0
            audio_tokens:
              type: integer
              minimum: 0
        source:
          type: string
          enum: [provider, estimated, reconciled]
    GatewayMetadata:
      type: object
      additionalProperties: false
      required: [request_id, attempt_count]
      properties:
        request_id:
          type: string
        attempt_count:
          type: integer
          minimum: 1
          maximum: 32
          description: Actual number of independently recorded physical provider attempts.
        route_policy_version:
          type: integer
          format: int64
        usage_complete:
          type: boolean
    ModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, object, owned_by]
            properties:
              id:
                type: string
              object:
                const: model
              owned_by:
                type: string
                const: ai-gateway
              capabilities:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [chat, stream, tools, parallel_tools, structured_output, vision, audio_input, audio_output, embeddings]
    CreateVirtualKeyRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [live, test]
          default: live
        expires_at:
          type: [string, 'null']
          format: date-time
        allowed_models:
          type: [array, 'null']
          maxItems: 256
          description: Null inherits project policy; an empty array denies every model.
          items:
            type: string
            minLength: 1
            maxLength: 128
        limits:
          oneOf:
            - $ref: '#/components/schemas/VirtualKeyLimits'
            - type: 'null'
    RotateVirtualKeyRequest:
      type: object
      additionalProperties: false
      properties:
        grace_period_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 900
    VirtualKeyLimits:
      type: object
      additionalProperties: false
      properties:
        rpm:
          type: integer
          minimum: 1
        tpm:
          type: integer
          minimum: 1
        concurrency:
          type: integer
          minimum: 1
    VirtualKeyMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - project_id
        - prefix
        - status
        - effective_status
        - version
        - created_at
        - created_by
        - updated_at
        - updated_by
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        prefix:
          type: string
          pattern: '^agw_(live|test)_[a-z0-9]{8,32}$'
          description: Non-secret support and lookup prefix.
        status:
          type: string
          enum: [active, rotating, revoked]
        effective_status:
          type: string
          enum: [active, rotating, revoked, expired, rotation_grace_elapsed]
        expires_at:
          type: [string, 'null']
          format: date-time
        allowed_models:
          type: [array, 'null']
          items:
            type: string
        limits:
          oneOf:
            - $ref: '#/components/schemas/VirtualKeyLimits'
            - type: 'null'
        rotated_from_id:
          type: [string, 'null']
          format: uuid
        rotation_grace_expires_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by:
          type: [string, 'null']
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    IssuedVirtualKey:
      type: object
      additionalProperties: false
      required: [metadata, credential]
      properties:
        metadata:
          $ref: '#/components/schemas/VirtualKeyMetadata'
        credential:
          type: string
          writeOnly: true
          description: Returned only by create/rotate; never retrievable, logged, or persisted.
    RouteAttempt:
      type: object
      required: [id, attempt_no, deployment_id, status, started_at]
      properties:
        id:
          type: string
        attempt_no:
          type: integer
        deployment_id:
          type: string
        status:
          type: string
          enum: [created, connecting, headers_received, streaming, succeeded, retryable_failed, failed, partial_failed, cancelled]
        started_at:
          type: string
          format: date-time
        first_byte_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        end_reason:
          type: [string, 'null']
        usage:
          $ref: '#/components/schemas/Usage'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, type, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            type:
              type: string
            param:
              type: [string, 'null']
            request_id:
              type: string
            retryable:
              type: boolean
            retry_after_ms:
              type: [integer, 'null']
              minimum: 0
    ErrorCode:
      type: string
  responses:
    InvalidRequest:
      description: Invalid or unsupported request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, disabled, or expired virtual key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The authenticated subject is not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource was not found within the authorized tenant scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The requested lifecycle transition conflicts with current state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: The HTTP method is not allowed for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RequestTooLarge:
      description: Request body, header, or content part exceeds configured limits
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Content-Type is not application/json or request content encoding is unsupported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: RPM, TPM, concurrency, budget, or upstream capacity limit
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderFailure:
      description: Provider or provider protocol failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ProviderTimeout:
      description: Provider did not respond within the active timeout budget
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GatewayUnavailable:
      description: No healthy deployment or a required gateway dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ClientClosedRequest:
      description: The caller cancelled the request before a response completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: The requested execution mode is not implemented in the current milestone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
security:
  - virtualKey: []
